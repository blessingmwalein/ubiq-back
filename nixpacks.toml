# nixpacks.toml for Laravel + Frontend (Vite/React/Vue) + Nginx
[phases.setup]
commands = [
    # System dependencies for Laravel + Node
    "apk add --no-cache bash git unzip curl libpng-dev libzip-dev oniguruma-dev nodejs npm",
    
    # PHP extensions
    "docker-php-ext-install pdo_mysql mbstring bcmath gd",
    "pecl install redis && docker-php-ext-enable redis"
]

[phases.build]
commands = [
    # PHP backend
    "composer install --no-dev --optimize-autoloader",
    "php artisan key:generate --force",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    
    # Frontend
    "npm install --legacy-peer-deps",
    "npm run build"
]

[phases.start]
commands = [
    # Start PHP-FPM in background
    "php-fpm &",

    # Start Nginx
    "nginx -g 'daemon off;'"
]

