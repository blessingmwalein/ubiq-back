# nixpacks.toml
[phases.setup]
# Install system dependencies for Ubuntu
commands = [
  "apt-get update",
  "apt-get install -y bash git unzip curl libpng-dev libzip-dev libonig-dev nodejs npm php-cli php-mbstring php-bcmath php-gd php-xml composer",
  "pecl install redis && docker-php-ext-enable redis"
]

[phases.install]
# Install PHP dependencies using Composer
commands = [
  "composer install --no-interaction --optimize-autoloader",
  "npm install"
]

[phases.build]
# Build frontend assets
commands = [
  "npm run build"
]

[phases.start]
# Start Laravel using PHP's built-in server
# You can change to php-fpm + nginx if preferred
commands = [
  "php artisan migrate --force",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan serve --host=0.0.0.0 --port=8080"
]

